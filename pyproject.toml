[tool.black]
line-length = 110
target-version = ["py310", "py311"]
extend-exclude = '''
/(
  web/node_modules
  | models/weights
)/
'''

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["core", "models", "pipelines", "api", "desktop", "shared"]
skip = ["web/node_modules", "models/weights"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["web/", "models/weights/", "tests/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["core", "models", "pipelines", "api", "shared"]
omit = ["*/tests/*"]
