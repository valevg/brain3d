<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Brain3D AI — 3D-визуализация</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <!-- Полноэкранный 3D-вьюпорт (Three.js монтируется сюда в main.js) -->
    <div id="app"></div>

    <header class="topbar">
      <div>
        <h1 id="app-title">Brain3D AI</h1>
        <span class="subtitle" id="app-subtitle"></span>
      </div>
      <div id="locale-switch"></div>
    </header>

    <!-- Кнопки сворачивания панелей: задвигают сайдбар слева и панель результатов
         справа за край экрана, освобождая место для 3D-вьюпорта. -->
    <button type="button" class="collapse-toggle toggle-sidebar" id="toggle-sidebar" aria-controls="sidebar" aria-expanded="true">&#x25C0;</button>

    <aside class="sidebar" id="sidebar">
      <div class="panel" id="uploader-panel"></div>
      <div class="panel" id="resources-panel"></div>
      <div class="panel" id="pipeline-settings-panel"></div>
      <div class="panel" id="models-panel"></div>
    </aside>

    <div class="panel progress-panel" id="progress-bar-panel"></div>
    <button type="button" class="collapse-toggle toggle-results" id="toggle-results" aria-controls="model-info-panel" aria-expanded="true">&#x25B6;</button>
    <div class="panel model-info-panel" id="model-info-panel"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
