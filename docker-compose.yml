# Локальный/staging деплой Brain3D AI: FastAPI backend + Three.js frontend.
# Desktop-приложение (PyQt5) по умолчанию запускается локально на машине врача;
# для окружений без совместимого Python (например, хост с Python 3.13+, где
# недоступен torch==2.3.1) можно использовать сервис desktop (см. ниже) —
# он требует проброса X11/VNC, подробности в docker/Dockerfile.desktop.
#
# Запуск API+web:
#   docker compose up --build
# API будет доступен на http://localhost:8000, web-интерфейс — на http://localhost:8080.
#
# Запуск desktop-образа (опционально):
#   docker compose run --rm desktop

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: brain3d-api:latest
    container_name: brain3d-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_CORS_ORIGINS=["http://localhost:8080"]
    ports:
      - "8000:8000"
    volumes:
      - brain3d-data:/app/data
      - ./models/weights:/app/models/weights:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: brain3d-web:latest
    container_name: brain3d-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # Опциональный запуск PyQt5-приложения в контейнере (требует X11/VNC,
  # см. комментарии в docker/Dockerfile.desktop). Не стартует вместе с `up`:
  #   docker compose run --rm desktop
  desktop:
    profiles: ["desktop"]
    build:
      context: .
      dockerfile: docker/Dockerfile.desktop
    image: brain3d-desktop:latest
    environment:
      - DISPLAY=${DISPLAY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data:/app/data

volumes:
  brain3d-data:
    driver: local
